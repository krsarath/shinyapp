name: R tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - name: Install dependencies
        run: |
          install.packages(c("testthat", "shiny", "ggplot2", "ggVennDiagram", "dplyr"))
        shell: Rscript {0}
      - name: Install Bioconductor packages
        run: |
          install.packages("BiocManager")
          BiocManager::install(c("DESeq2", "edgeR", "NOISeq"))
        shell: Rscript {0}
      - name: Run tests
        run: testthat::test_dir("shinyvistaApp/tests")
        shell: Rscript {0}
